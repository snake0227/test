<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合クイズアプリ</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .category-select {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #3498db;
            color: white;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* 選択肢ボタンのスタイル */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .option-btn {
            background-color: #ecf0f1;
            color: #2c3e50;
            border: 1px solid #bdc3c7;
            text-align: left;
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #d0d7de;
        }
        .option-btn.selected {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        /* 選択肢内画像スタイル */
        .option-img {
            max-height: 80px;
            max-width: 150px;
            object-fit: contain;
            border-radius: 4px;
            background: white;
            padding: 2px;
            border: 1px solid #ddd;
        }

        .hidden {
            display: none;
        }
        #result-message {
            font-weight: bold;
            margin-top: 10px;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
        .quiz-image {
            max-width: 100%;
            max-height: 250px;
            display: block;
            margin: 15px auto;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <h1>総合クイズアプリ</h1>

    <div id="menu-screen" class="card">
        <h2>カテゴリを選んでください</h2>
        <div class="category-select">
            <button onclick="startQuiz('history')">歴史</button>
            <button onclick="startQuiz('civics')">公民</button>
            <button onclick="startQuiz('physics')">物理</button>
            <button onclick="startQuiz('chemistry')">化学</button>
        </div>
        <div id="stats" style="margin-top: 20px; font-size: 14px; color: #666; text-align: center;"></div>
    </div>

    <div id="quiz-screen" class="card hidden">
        <h2 id="category-title"></h2>
        <p id="question-progress"></p>
        <p id="question-text" style="font-size: 18px; font-weight: bold; white-space: pre-wrap;"></p>
        
        <!-- イラストを表示する動的エリア -->
        <div id="image-container"></div>

        <!-- 記述式用の入力欄＆ボタン -->
        <div id="text-answer-area">
            <input type="text" id="user-answer" placeholder="答えを入力してください" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="handleKeyDown(event)">
            <button onclick="submitTextAnswer()">答え合わせ</button>
        </div>

        <!-- 四択式用の選択肢ボタンエリア -->
        <div id="choice-answer-area" class="options-container hidden"></div>
        <!-- 複数選択時専用の決定ボタン -->
        <button id="multi-submit-btn" class="hidden" onclick="submitMultiChoiceAnswer()" style="margin-top: 10px; width: 100%;">答え合わせ</button>
        
        <p id="result-message"></p>
        <button id="next-btn" class="hidden" onclick="nextQuestion()" style="margin-top: 15px;">次の問題へ</button>
    </div>

    <div id="score-screen" class="card hidden">
        <h2>結果発表</h2>
        <p id="final-score" style="font-size: 20px;"></p>
        <button onclick="returnToMenu()">メニューに戻る</button>
    </div>

    let currentCategory = '';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let selectedOptions = [];

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadStats() {
        const statsDiv = document.getElementById('stats');
        const histProf = localStorage.getItem('hist_proficiency') || '未挑戦';
        const civicsProf = localStorage.getItem('civics_proficiency') || '未挑戦';
        const physProf = localStorage.getItem('phys_proficiency') || '未挑戦';
        const chemProf = localStorage.getItem('chem_proficiency') || '未挑戦';
        statsDiv.innerHTML = `前回の記録 - 歴史: ${histProf} / 公民: ${civicsProf} / 物理: ${physProf} / 化学: ${chemProf}`;
    }

    function startQuiz(category) {
        currentCategory = category;
        
        const validQuestions = quizData[category].filter(item => item.q && item.q.trim() !== "");
        
        if (validQuestions.length === 0) {
            alert('このカテゴリにはまだ有効な問題が入力されていません。');
            return;
        }

        currentQuestions = shuffleArray(validQuestions);
        currentIndex = 0;
        score = 0;

        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        const titles = {
            history: '【歴史クイズ】',
            civics: '【公民クイズ】',
            physics: '【物理クイズ】',
            chemistry: '【化学クイズ】'
        };
        document.getElementById('category-title').innerText = titles[category];

        showQuestion();
    }

    function showQuestion() {
        const textInputArea = document.getElementById('text-answer-area');
        const choiceArea = document.getElementById('choice-answer-area');
        const multiSubmitBtn = document.getElementById('multi-submit-btn');
        const inputElem = document.getElementById('user-answer');
        const imageContainer = document.getElementById('image-container');

        inputElem.value = '';
        inputElem.disabled = false;
        selectedOptions = [];
        document.getElementById('result-message').innerText = '';
        document.getElementById('next-btn').classList.add('hidden');
        multiSubmitBtn.classList.add('hidden');

        const currentQ = currentQuestions[currentIndex];
        document.getElementById('question-progress').innerText = `問題 ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('question-text').innerHTML = currentQ.q;
        
        imageContainer.innerHTML = '';

        if (currentQ.img && currentQ.img.trim() !== "") {
            const imgElem = document.createElement('img');
            imgElem.className = 'quiz-image';
            imgElem.src = currentQ.img;
            imgElem.alt = '問題のイラスト';
            imageContainer.appendChild(imgElem);
        }

        if (currentQ.options && currentQ.options.length > 0) {
            textInputArea.classList.add('hidden');
            choiceArea.classList.remove('hidden');
            
            choiceArea.innerHTML = '';
            const shuffledOptions = shuffleArray(currentQ.options);
            const isMultiSelect = Array.isArray(currentQ.a);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                let optionValue = '';
                let optionText = '';
                let optionImgSrc = '';

                if (typeof opt === 'object' && opt !== null) {
                    optionValue = opt.text || opt.img;
                    optionText = opt.text || '';
                    optionImgSrc = opt.img || '';
                } else {
                    optionValue = opt;
                    optionText = opt;
                }

                if (optionText) {
                    const span = document.createElement('span');
                    span.innerText = optionText;
                    btn.appendChild(span);
                }

                if (optionImgSrc) {
                    const img = document.createElement('img');
                    img.src = optionImgSrc;
                    img.className = 'option-img';
                    img.alt = '選択肢の画像';
                    btn.appendChild(img);
                }

                if (isMultiSelect) {
                    btn.onclick = () => toggleOptionSelect(btn, optionValue);
                } else {
                    btn.onclick = () => submitSingleChoiceAnswer(optionValue);
                }
                choiceArea.appendChild(btn);
            });

            if (isMultiSelect) {
                multiSubmitBtn.classList.remove('hidden');
            }
        } else {
            textInputArea.classList.remove('hidden');
            choiceArea.classList.add('hidden');
            inputElem.focus();
        }
    }

    function submitTextAnswer() {
        const userAnswer = document.getElementById('user-answer').value.trim();
        const correctAnswer = currentQuestions[currentIndex].a;
        if (!userAnswer) return;

        document.getElementById('user-answer').disabled = true;
        evaluateAnswer(userAnswer === correctAnswer, correctAnswer);
    }

    function submitSingleChoiceAnswer(selectedOption) {
        const correctAnswer = currentQuestions[currentIndex].a;
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        evaluateAnswer(selectedOption === correctAnswer, correctAnswer);
    }

    function toggleOptionSelect(btn, optionValue) {
        if (selectedOptions.includes(optionValue)) {
            selectedOptions = selectedOptions.filter(item => item !== optionValue);
            btn.classList.remove('selected');
        } else {
            selectedOptions.push(optionValue);
            btn.classList.add('selected');
        }
    }

    function submitMultiChoiceAnswer() {
        const correctAnswer = currentQuestions[currentIndex].a;
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);
        document.getElementById('multi-submit-btn').classList.add('hidden');

        const isCorrect = selectedOptions.length === correctAnswer.length &&
            selectedOptions.every(val => correctAnswer.includes(val));

        const displayCorrectAnswer = correctAnswer.join('・');
        evaluateAnswer(isCorrect, displayCorrectAnswer);
    }

    function evaluateAnswer(isCorrect, correctAnswer) {
        const resultMsg = document.getElementById('result-message');

        if (isCorrect) {
            resultMsg.innerText = "正解です！";
            resultMsg.className = "correct";
            score++;
        } else {
            resultMsg.innerText = `不正解… 正解は「${correctAnswer}」です`;
            resultMsg.className = "incorrect";
        }

        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('next-btn').focus();
    }

    function handleKeyDown(event) {
        if (event.key === 'Enter') {
            const nextBtn = document.getElementById('next-btn');
            if (nextBtn.classList.contains('hidden')) {
                const multiBtn = document.getElementById('multi-submit-btn');
                if (!multiBtn.classList.contains('hidden')) {
                    submitMultiChoiceAnswer();
                } else {
                    submitTextAnswer();
                }
            } else {
                nextQuestion();
            }
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('score-screen').classList.remove('hidden');
        
        const percentage = Math.round((score / currentQuestions.length) * 100);
        document.getElementById('final-score').innerText = `正解数: ${score} / ${currentQuestions.length} (${percentage}%)`;

        const keys = {
            history: 'hist_proficiency',
            civics: 'civics_proficiency',
            physics: 'phys_proficiency',
            chemistry: 'chem_proficiency'
        };
        localStorage.setItem(keys[currentCategory], `${percentage}% (${score}/${currentQuestions.length})`);
    }

    function returnToMenu() {
        document.getElementById('score-screen').classList.add('hidden');
        document.getElementById('menu-screen').classList.remove('hidden');
        loadStats();
    }

    window.onload = loadStats;
</script>

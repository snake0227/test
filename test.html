<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合クイズアプリ (歴史・公民)</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .category-select {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #3498db;
            color: white;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .hidden {
            display: none;
        }
        #result-message {
            font-weight: bold;
            margin-top: 10px;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
    </style>
</head>
<body>

    <h1>総合クイズアプリ</h1>

    <div id="menu-screen" class="card">
        <h2>カテゴリを選んでください</h2>
        <div class="category-select">
            <button onclick="startQuiz('history')">歴史</button>
            <button onclick="startQuiz('civics')">公民</button>
        </div>
        <div id="stats" style="margin-top: 20px; font-size: 14px; color: #666;"></div>
    </div>

    <div id="quiz-screen" class="card hidden">
        <h2 id="category-title"></h2>
        <p id="question-progress"></p>
        <p id="question-text" style="font-size: 18px; font-weight: bold;"></p>
        
        <!-- 予測変換や自動補完をオフにする属性 -->
        <input type="text" id="user-answer" placeholder="答えを入力してください" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="handleKeyDown(event)">
        <button onclick="submitAnswer()">答え合わせ</button>
        
        <p id="result-message"></p>
        <button id="next-btn" class="hidden" onclick="nextQuestion()" style="margin-top: 15px;">次の問題へ</button>
    </div>

    <div id="score-screen" class="card hidden">
        <h2>結果発表</h2>
        <p id="final-score" style="font-size: 20px;"></p>
        <button onclick="returnToMenu()">メニューに戻る</button>
    </div>

<script>
    // 問題データ（歴史 ＋ 公民プリント(1)〜(41)の全問題）
    const quizData = {
        history: [

            { q: "603年に定められた制度は？", a: "冠位十二階" },
            { q: "604年に定められた決まりは？", a: "十七条憲法" },
            { q: "一隅が滅びて新しく成立し、国際的緊張を高めた中国の王朝は？", a: "隋" },

            { q: "672年に起こった内乱は？", a: "壬申の乱" },
            { q: "壬申の乱の勝者・大海人皇子が即位した天皇名は？", a: "天武天皇" },
            { q: "国を運営するための「律」と「令」を整え、天皇を中心に国を治めるしくみを何というか？", a: "律令国家" },
            { q: "「律」とは、何の決まり？", a: "刑罰" },
            { q: "「令」とは、何の決まり？", a: "政治" },
            { q: "律令制は、誰を中心に国を治めるしくみ？", a: "天皇" },
            { q: "701年に制定された代表的な律令は何？", a: "大宝律令" },
            { q: "701年に大宝律令をつくる中心となった人物は誰？", a: "藤原不比等" },
            { q: "天皇が政治を行う中央政府を何という？", a: "太政官" },
            { q: "役人はどこに住んでいた？", a: "京" },
            { q: "身分が高い人を何というか？", a: "貴族" },
            { q: "国中に置かれた役所を何というか？", a: "国府" },
            { q: "国の下に置かれた単位は？", a: "郡" },
            { q: "郡をまとめる役人を何というか？", a: "郡司" },
            // プリントNo.3
            { q: "710年に都が移された場所はどこですか？", a: "平城京" },
            { q: "平城京は、唐の何都を参考にしましたか？", a: "長安" },
            { q: "710年に平城京へ都を移して始まった時代は何ですか？", a: "奈良時代" },
            { q: "日本で初めての本格的貨幣は何ですか？", a: "和同開珎" },
            { q: "和同開珎は、唐の何という貨幣にならいましたか？", a: "開元通宝" },
            { q: "718年につくられた法律は何ですか？", a: "養老令" },
            { q: "東北にいた、朝廷とは異なる文化をもつ人々を何といいますか？", a: "蝦夷" },
            { q: "九州にいた、朝廷とは異なる文化をもつ人々を何といいますか？", a: "隼人" },
            { q: "朝廷が東北に置いた拠点は何ですか？", a: "多賀城" },
            { q: "朝廷が九州に置いた拠点は何ですか？", a: "大宰府" },
            { q: "この時代に編纂された歴史書を3つ答えなさい", a: "古事記・日本書紀・風土記" },
            // プリントNo.4
            { q: "藤原不比等の次に権力を握った皇族は誰ですか？", a: "長屋王" },
            { q: "長屋王の次に権力を握った、藤原不比等の4人の子は？", a: "藤原四子" },
            { q: "藤原不比等は、どのような国家制度を整えましたか？", a: "律令制" },
            { q: "長屋王が皇居にしようとした女性は誰ですか？", a: "藤原宮子" },
            { q: "長屋王が藤原氏に追いこまれて自殺した事件は？", a: "長屋王の変" },
            // プリントNo.5
            { q: "吉備真備や玄嫰の登用に反発して起こった乱は何か？", a: "藤原広嗣の乱" },
            { q: "仏教の力で国を守ろうとした天皇は誰か？", a: "聖武天皇" },
            { q: "聖武天皇が国を守るために重視した宗教は何か？", a: "仏教" },
            { q: "橘諸兄のあとに入政権を握った人物は誰か？", a: "藤原仲麻呂" },
            { q: "孝謙上皇の病気を治し、権力を強めた僧は誰か？", a: "道鏡" },
            { q: "藤原仲麻呂（恵美押勝）が起こした反乱は何か？", a: "恵美押勝の乱" },
            { q: "道鏡が天皇になろうとした地位は何か？", a: "太政大臣禅師" },
            { q: "道鏡が天皇になることを阻止した人物は誰か？", a: "和気清麻呂" },
            { q: "道鏡のあとに政権を担った藤原氏の人物は誰か？", a: "藤原百川" },
            { q: "藤原百川とともに律令制の立て直しを進めた天皇は誰か？", a: "光仁天皇" }
        ],
        civics: [
            { q: "(1) 1889年に公布され、天皇が統治権を持つことを定めた憲法を何というか。", a: "大日本帝国憲法" },
            { q: "(2) 主権が制定し、国民に与える形で定められた憲法を何というか。", a: "欽定憲法" },
            { q: "(3) 大日本帝国憲法のもとで、天皇が陸軍を指揮・統帥する機関を何というか。", a: "統帥権" },
            { q: "(4) 大日本帝国憲法において、天皇の支配を受ける国民を何と呼んだか。", a: "臣民" },
            { q: "(5) 1946年に公布され、1947年5月3日に施行された現在の日本の憲法を何というか。", a: "日本国憲法" },
            { q: "(6) 国民が制定する、または国民の意思に基づいて決定される憲法を何というか。", a: "民定憲法" },
            { q: "(7) 日本国憲法の基本原理の一つで、戦争を放棄し、平和を大切にする考え方を何というか。", a: "平和主義" },
            { q: "(8) 日本国憲法第9条に定められている、(7)の具体的な内容を3つ答えなさい。", a: "戦争の放棄・戦力の不保持・交戦権の否認" },
            { q: "(9) 日本国憲法の基本原理の一つで、人が生まれながらに持つ権利を大切にする考え方を何というか。", a: "基本的人権の尊重" },
            { q: "(10) 日本国憲法の基本原理の一つで、国の政治のあり方を最終的に決める権力が国民にあるという基本原理を何というか。", a: "国民主権" },
            { q: "(11) 1945年、日本に降伏を求め、戦後の日本の民主化などの方針を示した宣言を何というか。", a: "ポツダム宣言" },
            { q: "(12) 第二次世界大戦後、日本の占領政策を進めた連合国軍最高司令官総司令部をアルファベット3文字で何というか。", a: "GHQ" },
            { q: "(13) 第二次世界大戦後、GHQの最高司令官として日本の占領政策を指導した人物は誰か。", a: "マッカーサー" },
            { q: "(14) 日本国憲法の制定過程で、日本政府が作成したものの大日本帝国憲法と大きく変わらない内容だったため、GHQに不十分と判断された憲法改正案を何というか。", a: "松本案" },
            { q: "(15) 法律や命令などが憲法に違反していないかを裁判所が判断する権限を何というか。", a: "違憲審査権" },
            { q: "(16) 日本の司法機関の中で最も上位に位置する裁判所を何というか。", a: "最高裁判所" },
            { q: "(17) (16)は、上訴することのできない最終的な裁判所であることから、何と呼ばれるか。", a: "終審裁判所" },
            { q: "(18) (16)は違憲審査権を持ち、憲法を守る重要な役割を担うことから、何と呼ばれるか。", a: "憲法の番人" },
            { q: "(19) 通常の法律よりも改正の手続きが厳しく定められている憲法を何というか。", a: "硬性憲法" },
            { q: "(20) 一人ひとりがかけがえのない存在として大切にされなければならないという、日本国憲法第13条の考え方を何というか。", a: "個人の尊重" },
            { q: "(21) 日本国憲法第13条で保障されている、生命・自由を大切にし、幸福を追い求める権利を何というか。", a: "幸福追求権" },
            { q: "(22) 日本国憲法第14条で定められている、すべての人が差別されず平等に扱われるという原則を何というか。", a: "法の下の平等" },
            { q: "(23) 結婚していない男女間に生まれた相続分を、結婚している男女の子の半分としていた民法の規定が違憲かどうか争われた裁判を何というか。", a: "婚外子相続差別訴訟" },
            { q: "(24) 日本国憲法第24条で定められている、婚姻や家族生活において男女が対等な立場にあるという原則を何というか。", a: "両性の平等" },
            { q: "(25) 選挙において、すべての有権者の一票の価値を平等に扱うという原則を何というか。", a: "選挙の平等" },
            { q: "(26) 経済状況や性別などによって差別されず、能力に応じて等しく教育を受ける機会が保障されることを何というか。", a: "教育の機会均等等" },
            { q: "(27) 特定の民族や国籍などの人に対して、差別や憎悪をあおったり、排斥を呼びかけたりする言動を何というか。", a: "ヘイトスピーチ" },
            { q: "(28) 国家から不当に干渉や制限を受けず、自由に行動できることを実現する自由を何というか。", a: "消極的自由" },
            { q: "(29) 思想・良心、信教、表現など、人間の内面やその表現に関する自由を何というか。", a: "精神の自由" },
            { q: "(30) 国や地方公共団体などの政教を分離し、特定の宗教に特権を与えたり宗教的活動をしたりすることを禁止する原則を何というか。", a: "政教分離" },
            { q: "(31) 不当に逮捕・拘束されたり、刑罰を科されたりしないことを保障する自由を何というか。", a: "身体の自由" },
            { q: "(32) 職業選択の自由や財産権など、経済に関する自由をまとめて何というか。", a: "経済活動の自由" },
            { q: "(33) 法律で定められた適正な手続きによらなければ、生命や自由を奪われたり、刑罰を科されたりしないという保障を何というか。", a: "適正手続きの保障" },
            { q: "(34) 刑事事件で、自分に不利益となる供述を強要されない権利を何というか。", a: "黙秘権" },
            { q: "(35) 行為をしたときには合法だったことを、後から作った法律によって処罰することを禁止する原則を何というか。", a: "遡及処罰の禁止" },
            { q: "(36) 原則として、裁判官が発する令状がなければ逮捕や捜査などをすることができないという原則を何というか。", a: "令状主義" },
            { q: "(37) 人権と人権が衝突した場合に、それぞれの人権を調整するための原理を何というか。", a: "公共の福祉" },
            { q: "(38) 小説『チャタレイ夫人の恋人』のわいせつ性と表現の自由が争われた事件を何というか。", a: "チャタレイ事件" },
            { q: "(39) 企業が採用時に応募者の思想・信条を調査することなどが問題となり、私人間における人権保障が争われた事件を何というか。", a: "三菱樹脂事件" },
            { q: "(40) 愛媛県が公金の神社への玉串料などを支出したことが、憲法の政教分離原則に反するかが争われた訴訟を何というか。", a: "愛媛玉串料訴訟" },
            { q: "(41) 薬局を開設する際の距離制限が、職業選択の自由に反するかが争われた訴訟を何というか。", a: "薬事法距離制限訴訟" }
        ]
    };

    let currentCategory = '';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    // 配列をランダムにシャッフルする関数 (Fisher-Yates)
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadStats() {
        const statsDiv = document.getElementById('stats');
        const histProf = localStorage.getItem('hist_proficiency') || '未挑戦';
        const civicsProf = localStorage.getItem('civics_proficiency') || '未挑戦';
        statsDiv.innerHTML = `前回の記録 - 歴史: ${histProf} / 公民: ${civicsProf}`;
    }

    function startQuiz(category) {
        currentCategory = category;
        currentQuestions = shuffleArray(quizData[category]);
        currentIndex = 0;
        score = 0;

        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('category-title').innerText = category === 'history' ? '【歴史クイズ】' : '【公民クイズ】';

        showQuestion();
    }

    function showQuestion() {
        const inputElem = document.getElementById('user-answer');
        inputElem.value = '';
        inputElem.disabled = false;
        document.getElementById('result-message').innerText = '';
        document.getElementById('next-btn').classList.add('hidden');

        document.getElementById('question-progress').innerText = `問題 ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('question-text').innerText = currentQuestions[currentIndex].q;
        
        inputElem.focus();
    }

    function submitAnswer() {
        const userAnswer = document.getElementById('user-answer').value.trim();
        const correctAnswer = currentQuestions[currentIndex].a;
        const resultMsg = document.getElementById('result-message');

        if (!userAnswer) return;

        document.getElementById('user-answer').disabled = true;

        if (userAnswer === correctAnswer) {
            resultMsg.innerText = "正解です！";
            resultMsg.className = "correct";
            score++;
        } else {
            resultMsg.innerText = `不正解… 正解は「${correctAnswer}」です`;
            resultMsg.className = "incorrect";
        }

        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('next-btn').focus();
    }

    function handleKeyDown(event) {
        if (event.key === 'Enter') {
            const nextBtn = document.getElementById('next-btn');
            if (nextBtn.classList.contains('hidden')) {
                submitAnswer();
            } else {
                nextQuestion();
            }
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('score-screen').classList.remove('hidden');
        
        const percentage = Math.round((score / currentQuestions.length) * 100);
        document.getElementById('final-score').innerText = `正解数: ${score} / ${currentQuestions.length} (${percentage}%)`;

        const key = currentCategory === 'history' ? 'hist_proficiency' : 'civics_proficiency';
        localStorage.setItem(key, `${percentage}% (${score}/${currentQuestions.length})`);
    }

    function returnToMenu() {
        document.getElementById('score-screen').classList.add('hidden');
        document.getElementById('menu-screen').classList.remove('hidden');
        loadStats();
    }

    window.onload = loadStats;
</script>

</body>
</html>

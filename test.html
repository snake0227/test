<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合クイズアプリ (生物・歴史)</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .category-select {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #3498db;
            color: white;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .hidden {
            display: none;
        }
        #result-message {
            font-weight: bold;
            margin-top: 10px;
        }
        .correct { color: #27ae60; }
        .incorrect { color: #c0392b; }
    </style>
</head>
<body>

    <h1>総合クイズアプリ</h1>

    <div id="menu-screen" class="card">
        <h2>カテゴリを選んでください</h2>
        <div class="category-select">
            <button onclick="startQuiz('biology')">生物</button>
            <button onclick="startQuiz('history')">歴史</button>
        </div>
        <div id="stats" style="margin-top: 20px; font-size: 14px; color: #666;"></div>
    </div>

    <div id="quiz-screen" class="card hidden">
        <h2 id="category-title"></h2>
        <p id="question-progress"></p>
        <p id="question-text" style="font-size: 18px; font-weight: bold;"></p>
        
        <input type="text" id="user-answer" placeholder="答えを入力してください" onkeydown="handleKeyDown(event)">
        <button onclick="submitAnswer()">答え合わせ</button>
        
        <p id="result-message"></p>
        <button id="next-btn" class="hidden" onclick="nextQuestion()" style="margin-top: 15px;">次の問題へ</button>
    </div>

    <div id="score-screen" class="card hidden">
        <h2>結果発表</h2>
        <p id="final-score" style="font-size: 20px;"></p>
        <button onclick="returnToMenu()">メニューに戻る</button>
    </div>

<script>
    // 問題データ
    const quizData = {
        biology: [
            { q: "遺伝子の本体である物質の名前は？", a: "DNA" },
            { q: "植物が光エネルギーを使って二酸化炭素と水から有機物を作る働きを何というか？", a: "光合成" },
            { q: "細胞の中でエネルギー（ATP）を産生する小器官の名前は？", a: "ミトコンドリア" },
            { q: "生物の体の基本単位となる構造を何というか？", a: "細胞" }
        ],
        history: [
            { q: "1192年に源頼朝が征夷大将軍に任命されて開いた幕府は？", a: "鎌倉幕府" },
            { q: "1603年に江戸幕府を開いた人物は誰？", a: "徳川家康" },
            { q: "1867年、第15代将軍徳川慶喜が行った政権返上を何というか？", a: "大政奉還" },
            { q: "平安京に都を移した天皇は誰？", a: "桓武天皇" }
        ]
    };

    let currentCategory = '';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    // 配列をランダムにシャッフルする関数 (Fisher-Yates)
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadStats() {
        const statsDiv = document.getElementById('stats');
        const bioProf = localStorage.getItem('bio_proficiency') || '未挑戦';
        const histProf = localStorage.getItem('hist_proficiency') || '未挑戦';
        statsDiv.innerHTML = `前回の記録 - 生物: ${bioProf} / 歴史: ${histProf}`;
    }

    function startQuiz(category) {
        currentCategory = category;
        // クイズ開始時に問題をランダムにシャッフル
        currentQuestions = shuffleArray(quizData[category]);
        currentIndex = 0;
        score = 0;

        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('category-title').innerText = category === 'biology' ? '【生物クイズ】' : '【歴史クイズ】';

        showQuestion();
    }

    function showQuestion() {
        const inputElem = document.getElementById('user-answer');
        inputElem.value = '';
        inputElem.disabled = false;
        document.getElementById('result-message').innerText = '';
        document.getElementById('next-btn').classList.add('hidden');

        document.getElementById('question-progress').innerText = `問題 ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('question-text').innerText = currentQuestions[currentIndex].q;
        
        // 入力欄に自動フォーカス
        inputElem.focus();
    }

    function submitAnswer() {
        const userAnswer = document.getElementById('user-answer').value.trim();
        const correctAnswer = currentQuestions[currentIndex].a;
        const resultMsg = document.getElementById('result-message');

        if (!userAnswer) return;

        document.getElementById('user-answer').disabled = true;

        if (userAnswer === correctAnswer) {
            resultMsg.innerText = "正解です！";
            resultMsg.className = "correct";
            score++;
        } else {
            resultMsg.innerText = `不正解… 正解は「${correctAnswer}」です`;
            resultMsg.className = "incorrect";
        }

        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('next-btn').focus();
    }

    function handleKeyDown(event) {
        if (event.key === 'Enter') {
            const nextBtn = document.getElementById('next-btn');
            if (nextBtn.classList.contains('hidden')) {
                submitAnswer();
            } else {
                nextQuestion();
            }
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('score-screen').classList.remove('hidden');
        
        const percentage = Math.round((score / currentQuestions.length) * 100);
        document.getElementById('final-score').innerText = `正解数: ${score} / ${currentQuestions.length} (${percentage}%)`;

        // localStorageに保存
        const key = currentCategory === 'biology' ? 'bio_proficiency' : 'hist_proficiency';
        localStorage.setItem(key, `${percentage}% (${score}/${currentQuestions.length})`);
    }

    function returnToMenu() {
        document.getElementById('score-screen').classList.add('hidden');
        document.getElementById('menu-screen').classList.remove('hidden');
        loadStats();
    }

    window.onload = loadStats;
</script>

</body>
</html>
